name: Deploy site

on:
  # Human pushes and merged review PRs. (Pushes made by the update workflow
  # do not trigger this; that workflow calls this one directly instead.)
  push:
    branches: [main]
    paths: ["public/**"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # when called after a data commit, deploy the new commit, not the triggering one
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
